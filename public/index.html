<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Service Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <span>CommunityServe</span>
      </div>
      <p class="tagline">Student Service Hours Tracker</p>
    </div>
  </header>

  <main class="container">

    <!-- ── Tab Navigation ── -->
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="add"     role="tab">Log Hours</button>
      <button class="tab"        data-tab="search"  role="tab">Search</button>
      <button class="tab"        data-tab="all"     role="tab">All Records</button>
    </nav>

    <!-- ── Toast Notification ── -->
    <div id="toast" class="toast" aria-live="polite"></div>

    <!-- ════════════════════════════════════════════
         TAB 1 – ADD RECORD
    ════════════════════════════════════════════ -->
    <section id="tab-add" class="tab-panel active">
      <h2 class="section-title">Log Service Hours</h2>

      <form id="add-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="student_name">Student Name</label>
            <input type="text" id="student_name" name="student_name" placeholder="Jane Doe" required />
          </div>
          <div class="field">
            <label for="supervisor_name">Supervisor Name</label>
            <input type="text" id="supervisor_name" name="supervisor_name" placeholder="Mr. Smith" required />
          </div>
          <div class="field">
            <label for="service_date">Date of Service</label>
            <input type="date" id="service_date" name="service_date" required />
          </div>
          <div class="field">
            <label for="hours">Hours Completed</label>
            <input type="number" id="hours" name="hours" placeholder="4.5" min="0.5" step="0.5" required />
          </div>
          <div class="field full">
            <label for="activity_description">Activity Description</label>
            <textarea id="activity_description" name="activity_description" rows="3"
              placeholder="Describe the community service activity performed…" required></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">
          <span class="btn-icon">+</span> Submit Record
        </button>
      </form>
    </section>

    <!-- ════════════════════════════════════════════
         TAB 2 – SEARCH
    ════════════════════════════════════════════ -->
    <section id="tab-search" class="tab-panel hidden">
      <h2 class="section-title">Search by Student Name</h2>

      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Enter student name…" />
        <button id="search-btn" class="btn btn-primary">Search</button>
      </div>

      <div id="search-results"></div>
    </section>

    <!-- ════════════════════════════════════════════
         TAB 3 – ALL RECORDS
    ════════════════════════════════════════════ -->
    <section id="tab-all" class="tab-panel hidden">
      <div class="section-header">
        <h2 class="section-title">All Service Records</h2>
        <button id="refresh-btn" class="btn btn-ghost">↻ Refresh</button>
      </div>
      <div id="all-records"></div>
    </section>

  </main>

  <!-- ── Edit Modal ── -->
  <div id="edit-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Edit Record</h3>
        <button class="modal-close" id="close-modal" aria-label="Close">✕</button>
      </div>
      <form id="edit-form" novalidate>
        <input type="hidden" id="edit-id" />
        <div class="form-grid">
          <div class="field">
            <label for="edit-student">Student Name</label>
            <input type="text" id="edit-student" required />
          </div>
          <div class="field">
            <label for="edit-supervisor">Supervisor Name</label>
            <input type="text" id="edit-supervisor" required />
          </div>
          <div class="field">
            <label for="edit-date">Date of Service</label>
            <input type="date" id="edit-date" required />
          </div>
          <div class="field">
            <label for="edit-hours">Hours</label>
            <input type="number" id="edit-hours" min="0.5" step="0.5" required />
          </div>
          <div class="field full">
            <label for="edit-desc">Activity Description</label>
            <textarea id="edit-desc" rows="3" required></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancel-edit">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
